name: Deploy Staging

# Chạy khi CI (ci.yml) pass trên nhánh staging. Deploy BACKEND lên VPS (aaPanel)
# qua SSH + Docker Compose — xem DEPLOY.md để setup đầy đủ (VPS, aaPanel reverse
# proxy, GitHub Environment "staging" + secrets).
# Frontend (Next.js) KHÔNG deploy ở đây — Vercel tự deploy khi push nhánh
# `staging` (Git integration riêng, xem DEPLOY.md § Frontend).
on:
  workflow_run:
    workflows: ['CI']
    branches: [staging]
    types: [completed]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Guard — required secrets present
        run: |
          missing=0
          for v in STAGING_SSH_HOST STAGING_SSH_USER STAGING_SSH_KEY STAGING_DEPLOY_PATH; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing secret $v — xem DEPLOY.md để cấu hình GitHub Environment 'staging'."
              missing=1
            fi
          done
          exit $missing
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}

      - name: Deploy via SSH (git pull + docker compose up + migrate)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          port: ${{ secrets.STAGING_SSH_PORT || 22 }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.STAGING_DEPLOY_PATH }}
            git fetch origin staging
            git checkout staging
            git reset --hard origin/staging
            docker compose -f infra/docker-compose.deploy.yml --env-file .env up -d --build
            docker compose -f infra/docker-compose.deploy.yml --env-file .env exec -T backend pnpm prisma:deploy

      - name: Verify — health check qua domain công khai
        run: |
          for i in $(seq 1 10); do
            if curl -fsS "https://staging.kp.nhutnm.id.vn/api/v1/health"; then
              echo "OK"
              exit 0
            fi
            echo "Chưa sẵn sàng, thử lại ($i/10)..."
            sleep 6
          done
          echo "::error::Health check thất bại sau khi deploy — kiểm tra log container trên VPS và cấu hình reverse proxy aaPanel."
          exit 1
