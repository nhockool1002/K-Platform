name: Deploy Staging

# Chạy khi CI (ci.yml) pass trên nhánh staging. Deploy BACKEND lên VPS (aaPanel)
# qua SSH + Docker Compose — xem DEPLOY.md để setup đầy đủ (VPS, aaPanel reverse
# proxy, GitHub Environment "staging" + secrets).
# Frontend (Next.js) KHÔNG deploy ở đây — Vercel tự deploy khi push nhánh
# `staging` (Git integration riêng, xem DEPLOY.md § Frontend).
on:
  workflow_run:
    workflows: ['CI']
    branches: [staging]
    types: [completed]

# Chốt chặn thứ 2 (ngoài guard `event == 'push'` ở job bên dưới): nếu vẫn có
# 2 run Deploy Staging bị kích hoạt gần nhau (vd. vừa merge PR vào staging
# vừa mở PR khác từ staging đi nữa), group này đảm bảo chúng chạy TUẦN TỰ
# thay vì chồng lên nhau trên cùng 1 VPS — không cancel run đang chạy dở để
# tránh ngắt giữa chừng lúc `docker compose up`/`prisma migrate deploy`.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Guard — required secrets present
        run: |
          missing=0
          for v in STAGING_SSH_HOST STAGING_SSH_USER STAGING_SSH_KEY STAGING_DEPLOY_PATH; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing secret $v — xem DEPLOY.md để cấu hình GitHub Environment 'staging'."
              missing=1
            fi
          done
          exit $missing
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}

      - name: Deploy via SSH (git pull + docker compose up + migrate)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          port: ${{ secrets.STAGING_SSH_PORT || 22 }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.STAGING_DEPLOY_PATH }}
            git fetch origin staging
            git checkout staging
            git reset --hard origin/staging
            docker compose -f infra/docker-compose.deploy.yml --env-file .env up -d --build --wait --wait-timeout 120
            # Dùng thẳng node_modules/.bin/prisma thay vì `pnpm prisma:deploy`: image
            # production chỉ cài production dependencies (pnpm deploy --prod), gọi qua
            # `pnpm run` khiến pnpm thấy "thiếu" devDependencies so với package.json và
            # tự tải lại pnpm mới nhất qua corepack — từng gây lỗi ERR_PNPM_IGNORED_BUILDS.
            # Xem DEPLOY.md § Troubleshooting.
            docker compose -f infra/docker-compose.deploy.yml --env-file .env exec -T backend node_modules/.bin/prisma migrate deploy

      - name: Verify — health check qua domain công khai
        run: |
          for i in $(seq 1 10); do
            if curl -fsS "https://api-staging.kp.nhutnm.id.vn/api/v1/health"; then
              echo "OK"
              exit 0
            fi
            echo "Chưa sẵn sàng, thử lại ($i/10)..."
            sleep 6
          done
          echo "::error::Health check thất bại sau khi deploy — kiểm tra log container trên VPS và cấu hình reverse proxy aaPanel."
          exit 1
