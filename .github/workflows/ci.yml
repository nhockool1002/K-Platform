name: CI

on:
  pull_request:
    branches: [develop, staging, main]
  push:
    branches: [develop, staging, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Từ Phase 1: test (e2e) cần DB thật để verify Auth/RBAC — trỏ vào service postgres bên dưới.
  DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci?schema=public'
  JWT_ACCESS_SECRET: 'ci-only-access-secret'
  JWT_REFRESH_SECRET: 'ci-only-refresh-secret'

jobs:
  lint-build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm prisma:generate

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Prisma migrate deploy
        run: pnpm --filter backend prisma:deploy

      - name: Test (backend — unit)
        run: pnpm test

      - name: Test (backend — e2e)
        run: pnpm --filter backend test:e2e
