name: Deploy Production

# Chạy khi CI (ci.yml) pass trên nhánh main. Cần cấu hình GitHub Environment
# "production" với các secret: PRODUCTION_SSH_HOST, PRODUCTION_SSH_USER,
# PRODUCTION_SSH_KEY, PRODUCTION_DEPLOY_PATH — xem infra/README.md.
# Khuyến nghị bật "Required reviewers" trên Environment "production" để
# deploy production luôn cần một người bấm approve thủ công.
on:
  workflow_run:
    workflows: ['CI']
    branches: [main]
    types: [completed]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Guard — required secrets present
        run: |
          missing=0
          for v in PRODUCTION_SSH_HOST PRODUCTION_SSH_USER PRODUCTION_SSH_KEY PRODUCTION_DEPLOY_PATH; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing secret $v — xem infra/README.md để cấu hình GitHub Environment 'production'."
              missing=1
            fi
          done
          exit $missing
        env:
          PRODUCTION_SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          PRODUCTION_SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          PRODUCTION_DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}

      - name: Deploy via SSH (git pull + docker compose up)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_SSH_HOST }}
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.PRODUCTION_DEPLOY_PATH }}
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            docker compose pull || true
            docker compose up -d --build
            docker compose exec -T backend pnpm prisma:deploy
