name: kplatform

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kplatform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kplatform_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-kplatform_dev}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-kplatform}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kplatform}:${POSTGRES_PASSWORD:-kplatform_dev_password}@postgres:5432/${POSTGRES_DB:-kplatform_dev}?schema=public
      REDIS_URL: redis://redis:6379
      PORT: 4000
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-only-change-me-access}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-only-change-me-refresh}
    ports:
      - '${BACKEND_PORT:-4000}:4000'

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - '${FRONTEND_PORT:-3000}:3000'

volumes:
  postgres_data:
