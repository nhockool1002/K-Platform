# Dev nhanh: chỉ chạy Postgres + Redis trong Docker, FE/BE chạy trực tiếp trên host
# (pnpm dev:frontend / pnpm dev:backend) để có hot-reload nhanh nhất.
# Dùng: docker compose -f docker-compose.dev.yml up -d
name: kplatform-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kplatform
      POSTGRES_PASSWORD: kplatform_dev_password
      POSTGRES_DB: kplatform_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'

volumes:
  postgres_dev_data:
